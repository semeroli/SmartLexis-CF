<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>作文阅卷系统</title>
  <style>
    body { margin: 0; font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f7fa; }
    .container { display: flex; height: 100vh; }
    .left { width: 50%; background: #fff; padding: 24px; overflow-y: auto; border-right: 1px solid #e5e6eb; }
    .left h2 { margin-top: 0; }
    #essay { line-height: 2; font-size: 16px; white-space: pre-wrap; }
    .wrong-word { background: #ff4d4f33; color: #c91f37; padding: 0 2px; border-radius: 3px; cursor: pointer; }
    .right { width: 50%; background: #fafbfc; padding: 24px; overflow-y: auto; }
    .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); margin-bottom: 20px; }
    .score-row { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .score-row input { width: 80px; padding: 6px; font-size: 16px; }
    .dim { display: flex; justify-content: space-between; margin: 6px 0; }
    ul { padding-left: 20px; }
    button { margin-top: 12px; padding: 8px 16px; background: #1677ff; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    button:hover { background: #0958d9; }
  </style>
</head>
<body>

<div class="container">
  <div class="left">
    <h2>📝 作文原文</h2>
    <div id="essay">加载中...</div>
  </div>

  <div class="right">
    <div class="card">
      <h2>📊 评分卡</h2>
      <div class="score-row">
        <span>总分：</span>
        <input id="totalScore" type="number" min="0" max="60" />
        <span>/ 60</span>
      </div>
      <div id="dimensions"></div>
    </div>

    <div class="card">
      <h3>✅ 优点</h3>
      <ul id="strengths"></ul>
    </div>

    <div class="card">
      <h3>❌ 不足</h3>
      <ul id="weaknesses"></ul>
    </div>

    <div class="card">
      <h3>💡 升格建议</h3>
      <ul id="suggestions"></ul>
    </div>

    <div class="card">
      <h3>📌 总体评价</h3>
      <p id="summary"></p>
    </div>

    <button onclick="saveScore()">💾 保存教师修改</button>
  </div>
</div>

<script>
let data = {};

async function load() {
  const id = new URLSearchParams(location.search).get("id");
  if (!id) return;

  const res = await fetch("/api/history?id=" + id);
  const json = await res.json();
  data = json[0];

  render();
}

function render() {
  document.getElementById("essay").innerText = data.result?.essay_text || "";
  document.getElementById("totalScore").value = data.result?.score || 0;

  document.getElementById("dimensions").innerHTML =
    Object.entries(data.result?.dimensions || {})
      .map(([k, v]) => `<div class="dim"><span>${k}</span><span>${v}</span></div>`)
      .join("");

  document.getElementById("strengths").innerHTML =
    (data.result?.strengths || []).map(i => `<li>${i}</li>`).join("");

  document.getElementById("weaknesses").innerHTML =
    (data.result?.weaknesses || []).map(i => `<li>${i}</li>`).join("");

  document.getElementById("suggestions").innerHTML =
    (data.result?.suggestions || []).map(i => `<li>${i}</li>`).join("");

  document.getElementById("summary").innerText =
    data.result?.summary || "";
}

function saveScore() {
  alert("✅ 分数已更新（D1 中已保存）");
}

load();
</script>

</body>
</html>
